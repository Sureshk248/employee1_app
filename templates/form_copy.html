{% extends "base.html" %}

{% block content %} 
<style>

.selected-row {
    background-color: #f8f9fa !important;
    font-weight: bold;
}

</style>
   <div class="row">
    <div class="col-md-6" style="background-color: antiquewhite; border: #860df8 solid 2px;">
    <h1>Employee List</h1><br>
   <table border="1" cellpadding="10" cellspacing="0" class="table-bordered table-striped">
    <tr style="background-color: #2df8a4;">
        <th>Employee ID</th>
        <th>Name</th>
        <th>Designation</th>
        <th>Date of Birth</th>
        <th>Attachment</th>
    </tr>
    {% for emp in employees %}  
<tr style="cursor: pointer;"
    onclick="fillform(
        this,
        '{{ emp[0] }}',
        '{{ emp[1] }}',
        '{{ emp[2] }}',
        '{{ emp[3] }}',
        '{{ emp[4] }}'
    )">
        <td>{{ emp[0] }}</td>
        <td>{{ emp[1] }}</td>
        <td>{{ emp[2] }}</td>
        <td>{{ emp[3] }}</td>
        <td><a href="/uploads/{{ emp[0] }}" target="_blank">Download</a></td>
    </tr>
    {% endfor %}
   </table><br>
    </div>
 
    <div class="col-md-6" style="background-color: rgb(60, 192, 185); border: #860df8 solid 2px;">
    <h1>Employee data</h1><br><br>
    <form method="POST" action="/submit" enctype="multipart/form-data">
        <div class="form-group">
            <label for="pernr" class="col-sm-4 col-form-label">Employee ID:</label>
            <input type="number" id="pernr" name="pernr" value="{{ item.pernr if item else '' }}" required>
        </div>
        <div class="form-group">
            <label for="name" class="col-sm-4 col-form-label">Name:</label>
            <input type="text" id="name" name="name" value="{{ item.name if item else '' }}" required>
        </div>
        <div class="form-group">
            <label for="desig" class="col-sm-4 col-form-label">Designation:</label>
            <input type="text" id="desig" name="desig" value="{{ item.desig if item else '' }}" required>
        </div>
        <div class="form-group">
            <label for="dob" class="col-sm-4 col-form-label">Date of Birth:</label>
            <input type="date" id="dob" name="dob" value="{{ item.dob if item else '' }}" required>
        </div><input type="hidden" id="action" name="action" value="create">

    <input type="file" name="attachment">

<input type="submit" value="Save" class="btn btn-primary">

<button type="button" class="btn btn-danger" onclick="delete_emp()" >
    Delete
</button>
    </form>
    </div>
   </div>
   
   <div class="col-md-12 mt-3">

    <iframe
        id="pdfviewer"
        width="100%"
        height="600px"
        style="border:1px solid #ccc;">
    </iframe>

</div>

{% endblock %}
