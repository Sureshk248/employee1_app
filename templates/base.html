<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Crud Operations</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

  <body data-message="{{ message }}">
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <span class="navbar-brand mb-0 h1">Employee Options</span>
      </div>
    </nav>

    <div class="container-fluid mt-4">
        {% block content %}{% endblock %}
    </div>

<div class="modal fade" id="msgModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Message</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <p id="msgText"></p>
      </div>

      <div class="modal-footer">
        <button class="btn btn-primary" data-bs-dismiss="modal">OK</button>
      </div>

    </div>
  </div>
</div>
  </body> 
  
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const message = document.body.getAttribute('data-message');
    if (message) {
      document.getElementById('msgText').textContent = message;
      const msgModal = new bootstrap.Modal(document.getElementById('msgModal'));
      msgModal.show();
    }
  });
</script>

<script>
function fillform(row, pernr, name, desig, dob) {

    // Remove highlight from all rows
    const rows = document.querySelectorAll("table tr");

    rows.forEach(r => {
        r.classList.remove("selected-row");
    });

    // Highlight selected row
    row.classList.add("selected-row");

    // Fill form
    document.getElementById('pernr').value = pernr;
    document.getElementById('name').value = name;
    document.getElementById('desig').value = desig;
    document.getElementById('dob').value = dob;

    // Set action mode
    document.getElementById('action').value = "update";
}

function delete_emp() {
    const pernr = document.getElementById('pernr').value;
    if (pernr) {
        if (confirm("Are you sure you want to delete this employee?")) {
            document.getElementById('action').value = "delete";
            document.querySelector('form').submit();
        }
    } else {
        alert("Please select an employee to delete.");
    }
}

</script>
<script>

function openPDF(pernr) {

    document.getElementById("pdfviewer").src =
        "/uploads/" + pernr;

}

</script>
</html>
